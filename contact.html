<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Parisa Gupta</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav aria-label="Main navigation">
        <a href="index.html">Home</a>
        <a href="resume.html">Resume</a>
        <a href="projects.html">Projects</a>
        <a href="contact.html">Contact</a>
    </nav>
    <main class="page">
        <div class="contactrow">
            <section class="contactinfo">
                <h1>Let's connect.</h1>
                <p>I am open to learning opportunities, student collaborations and conversations related to business, events and entrepreneurship.</p>
                <div class="contactdetail">
                    <h2>Email</h2>
                    <a href="mailto:your-email@example.com">your-email@example.com</a>
                </div>
                <div class="contactdetail">
                    <h2>Location</h2>
                    <p>Bhopal, Madhya Pradesh, India</p>
                </div>
                <div class="contactdetail">
                    <h2>LinkedIn</h2>
                    <a href="https://www.linkedin.com/">Visit LinkedIn</a>
                </div>
            </section>
            <form class="contactform">
                <label for="name">Name</label>
                <input id="name" name="name" type="text">

                <label for="email">Email</label>
                <input id="email" name="email" type="email">

                <label for="message">Message</label>
                <textarea id="message" name="message" rows="5"></textarea>

                <button type="submit">Send message</button>
            </form>
        </div>
    </main>
</body>
</html>
